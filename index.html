<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FKB Remap</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Prompt',sans-serif;background:#050a12;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(0,120,255,.2) 0%,transparent 55%);pointer-events:none}
body::after{content:'';position:fixed;bottom:0;left:0;right:0;height:200px;background:radial-gradient(ellipse at 50% 100%,rgba(0,200,150,.08) 0%,transparent 60%);pointer-events:none}
.wrap{text-align:center;width:100%;max-width:460px;position:relative;z-index:1}
.logo-img{width:260px;margin:0 auto 4px;display:block;filter:drop-shadow(0 0 24px rgba(0,120,255,.6)) drop-shadow(0 4px 16px rgba(0,0,0,.5));transition:.3s}
.logo-img:hover{transform:scale(1.03);filter:drop-shadow(0 0 32px rgba(0,120,255,.8)) drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.shop-name{font-size:11px;color:#4a9eff;letter-spacing:4px;text-transform:uppercase;margin-bottom:2px;font-weight:700}
.tagline{font-size:11px;color:#2d4a6a;margin-bottom:32px;letter-spacing:1px}

/* CUSTOMER CARD - ใหญ่ */
.cust-card{background:linear-gradient(135deg,rgba(0,120,255,.12),rgba(0,200,150,.08));border:1px solid rgba(0,120,255,.35);border-radius:20px;padding:32px 28px;cursor:pointer;transition:.25s;text-decoration:none;display:block;position:relative;overflow:hidden;margin-bottom:14px}
.cust-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,120,255,.08),transparent);opacity:0;transition:.25s}
.cust-card:hover{border-color:rgba(0,120,255,.7);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,120,255,.25)}
.cust-card:hover::before{opacity:1}
.cust-card .icon{font-size:48px;margin-bottom:14px;display:block}
.cust-card .title{font-size:22px;font-weight:800;color:#e8eaf0;margin-bottom:8px;letter-spacing:.5px}
.cust-card .desc{font-size:13px;color:#6b8aaa;line-height:1.7}
.cust-card .badge-row{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(0,120,255,.15);color:#4a9eff;border:1px solid rgba(0,120,255,.2)}
.cust-card .cta{margin-top:18px;display:inline-block;background:linear-gradient(135deg,#0078ff,#00c896);color:#fff;padding:11px 32px;border-radius:10px;font-size:13px;font-weight:600;letter-spacing:.5px}

/* ADMIN CARD - เล็ก */
.admin-card{background:rgba(10,20,35,.6);border:1px solid rgba(26,58,92,.6);border-radius:12px;padding:14px 20px;cursor:pointer;transition:.2s;text-decoration:none;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px)}
.admin-card:hover{border-color:rgba(0,120,255,.4);background:rgba(0,120,255,.06)}
.admin-card .icon{font-size:20px;flex-shrink:0}
.admin-card .info{flex:1;text-align:left}
.admin-card .title{font-size:13px;font-weight:600;color:#8ba3bf}
.admin-card .desc{font-size:11px;color:#3a5470;margin-top:1px}
.admin-card .arrow{font-size:14px;color:#2d4a6a}

.footer{margin-top:18px;font-size:10px;color:#1a3050;letter-spacing:1px}
</style>
</head>
